<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d">
  <title id="t">How a question becomes real store data</title>
  <desc id="d">An MCP client sends JSON-RPC messages with an Mcp-Session-Id header to the /mcp endpoint of the Rails app. The MCP server routes them to prompts, resources or tools. Resources and tools read ActiveRecord models stored in PostgreSQL with pgvector. The semantic search tool also calls VoyageClient, which sends an HTTPS request to the Voyage AI embeddings API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c41e4a"/>
    </marker>
    
  </defs>

  <rect width="1200" height="580" rx="20" fill="#14261b"/>

  <text x="40" y="52" font-size="14" font-weight="600" letter-spacing="3" fill="#4fae7b" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif">HOW A QUESTION BECOMES REAL DATA</text>

  <!-- client -->
  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="30" y="115" width="160" height="120" rx="12"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="110" y="152">AI client</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="110" y="176">Claude</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="110" y="194">MCP Inspector</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="110" y="212">curl</text>

  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M190 175 H313"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9fb0a4" x="245" y="160">JSON-RPC 2.0</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9fb0a4" x="245" y="196">Mcp-Session-Id</text>

  <!-- rails container -->
  <rect x="300" y="85" width="590" height="455" rx="18" fill="#182f21" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="6 6"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" x="320" y="116" font-size="13" font-weight="600" letter-spacing="2" fill="#4fae7b">THIS RAILS APP</text>

  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="320" y="140" width="150" height="70" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="395" y="170">Transport</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="395" y="190">mounted at /mcp</text>

  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M470 175 H513"/>

  <rect fill="#1d3a2a" stroke="#c41e4a" stroke-width="2" x="520" y="140" width="190" height="70" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="615" y="170">MCP::Server</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="615" y="190">registry + sessions</text>

  <!-- server to cards -->
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M615 210 V238 H405 V262"/>
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M615 210 V262"/>
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M615 210 V238 H795 V262"/>

  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="320" y="268" width="170" height="80" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="405" y="300">Prompts</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="405" y="322">1 saved question</text>

  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="530" y="268" width="170" height="80" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="615" y="300">Resources</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="615" y="322">2 readable data sets</text>

  <rect fill="#1d3a2a" stroke="#c41e4a" stroke-width="2" x="710" y="268" width="170" height="80" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="795" y="300">Tools</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="795" y="322">7, incl. semantic search</text>

  <!-- to data -->
  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="320" y="400" width="380" height="50" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="510" y="431">ActiveRecord: Product, Order, OrderItem</text>

  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="720" y="400" width="150" height="50" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="795" y="431">VoyageClient</text>

  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M615 348 V398"/>
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M740 348 V372 H650 V398"/>
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M795 348 V398"/>

  <rect fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2" x="320" y="478" width="380" height="50" rx="10"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="510" y="509">PostgreSQL + pgvector</text>
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M510 450 V476"/>

  <!-- external -->
  <rect fill="#1d3a2a" stroke="#c41e4a" stroke-width="2" x="940" y="385" width="230" height="80" rx="12"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#edf1ed" x="1055" y="418">Voyage AI</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fb0a4" x="1055" y="440">embeddings API</text>
  <path stroke="#c41e4a" stroke-width="3" fill="none" marker-end="url(#a)" d="M870 425 H938"/>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9fb0a4" x="905" y="414">HTTPS</text>

  <!-- note -->
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" x="40" y="330" font-size="15" font-weight="600" fill="#e0476f">Nothing is hardcoded.</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#9fb0a4" text-anchor="start" x="40" y="354">The AI reads each tool's description</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#9fb0a4" text-anchor="start" x="40" y="372">and decides on its own which one to call.</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#9fb0a4" text-anchor="start" x="40" y="400">The answer comes from real rows,</text>
  <text font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#9fb0a4" text-anchor="start" x="40" y="418">not a guess.</text>
</svg>
