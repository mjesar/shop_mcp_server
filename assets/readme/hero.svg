<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Shop MCP Server</title>
  <desc id="d">A Ruby on Rails MCP server that lets an AI assistant read a store's products, orders and inventory, and search products by meaning. An AI client calls tools on the Rails server, which queries PostgreSQL with pgvector.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c41e4a"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="20" fill="#14261b"/>

  <g font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-size="18" font-weight="600" letter-spacing="3" fill="#4fae7b">MCP  ·  RAILS  ·  RAG</text>
    <text x="64" y="172" font-size="76" font-weight="600" fill="#edf1ed">Shop <tspan fill="#e0476f">MCP</tspan> Server</text>
    <rect x="66" y="196" width="72" height="4" rx="2" fill="#c41e4a"/>
    <text x="64" y="244" font-size="26" fill="#b7c4bb">Give an AI assistant real access to a store.</text>
    <text x="64" y="282" font-size="18" fill="#7f9186">A Ruby on Rails MCP server with semantic search on pgvector.</text>
  </g>

  <g font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#edf1ed" text-anchor="middle">
    <rect x="800" y="130" width="120" height="60" rx="10" fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2"/>
    <text x="860" y="166">AI client</text>
    <rect x="990" y="130" width="130" height="60" rx="10" fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2"/>
    <text x="1055" y="156">Rails</text>
    <text x="1055" y="176" font-size="13" fill="#7f9186">/mcp</text>
    <rect x="990" y="230" width="130" height="50" rx="10" fill="#1d3a2a" stroke="#2e7d4f" stroke-width="2"/>
    <text x="1055" y="260">Postgres</text>
    <line x1="922" y1="160" x2="986" y2="160" stroke="#c41e4a" stroke-width="4" marker-end="url(#a)"/>
    <line x1="1055" y1="192" x2="1055" y2="226" stroke="#c41e4a" stroke-width="4" marker-end="url(#a)"/>
    <text x="955" y="146" font-size="12" fill="#7f9186">tools</text>
  </g>
</svg>
