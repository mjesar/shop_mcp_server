default: &default
  adapter: postgresql
  encoding: unicode
  port: 5434
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: shop_mcp_server_development

test:
  <<: *default
  database: shop_mcp_server_test

production:
  primary:
    <<: *default
    database: shop_mcp_server_production
  cache:
    <<: *default
    database: shop_mcp_server_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: shop_mcp_server_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: shop_mcp_server_production_cable
    migrations_paths: db/cable_migrate
